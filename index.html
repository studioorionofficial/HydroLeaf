<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hydroleaf - Microgreens</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background: radial-gradient(circle at center, #0f3822 0%, #05140b 100%);
            color: #ffffff;
            font-family: 'Vazirmatn', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .card {
            background: rgba(10, 31, 18, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 38px 26px;
            border-radius: 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-wrapper {
            margin-bottom: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .logo-badge {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.25), rgba(6, 78, 59, 0.9));
            border: 2px solid rgba(74, 222, 128, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px rgba(34, 197, 94, 0.35);
        }
        .leaf-icon {
            width: 52px;
            height: 52px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        h1 {
            font-size: 30px;
            letter-spacing: 1.2px;
            margin-bottom: 6px;
            font-weight: 700;
            color: #ffffff;
        }
        .slogan {
            font-size: 15px;
            color: #86efac;
            margin-bottom: 24px;
            font-weight: 500;
            line-height: 1.6;
        }
        .section-title {
            font-size: 14px;
            color: #bbf7d0;
            margin-bottom: 18px;
            font-weight: 600;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }
        .btn {
            background: linear-gradient(135deg, rgba(20, 83, 45, 0.8), rgba(22, 101, 52, 0.9));
            color: #ffffff;
            padding: 15px 18px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid rgba(74, 222, 128, 0.2);
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(34, 197, 94, 0.45);
        }
        .phone-btn {
            background: linear-gradient(135deg, rgba(15, 76, 41, 0.8), rgba(21, 128, 61, 0.9));
        }
        .phone-number {
            direction: ltr;
            display: inline-block;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            letter-spacing: 0.8px;
        }
        .btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }
    </style>
</head>
